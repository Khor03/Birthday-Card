<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Happy Birthday Jessica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --char:#191411; --char-2:#241d18; --gold:#c9a24a; --gold-dim:#8a723a;
    --ember:#7a3324; --cream:#f3e9d6; --cream-dim:#cbbca0;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; background:var(--char); }
  body{
    display:flex; align-items:center; justify-content:center; min-height:100vh;
    font-family:'Jost',sans-serif; padding:32px 16px;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(201,162,74,0.08), transparent 55%),
      radial-gradient(ellipse at 80% 80%, rgba(122,51,36,0.15), transparent 60%),
      var(--char);
  }
  .card{
    position:relative; width:100%; max-width:400px; min-height:560px;
    background:linear-gradient(165deg,var(--char-2),var(--char) 70%);
    border:1px solid rgba(201,162,74,0.35); border-radius:4px; overflow:hidden;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.7);
    transition:transform 0.7s cubic-bezier(0.22,1,0.36,1);
  }
  .card.open{ transform:scale(1.015); }
  .card::before{
    content:''; position:absolute; inset:10px; border:1px solid rgba(201,162,74,0.22);
    pointer-events:none; z-index:3;
  }
  .card::after{
    content:''; position:absolute; inset:0; opacity:0.5; z-index:1; pointer-events:none;
    background-image:
      repeating-linear-gradient(115deg,transparent 0 18px,rgba(201,162,74,0.035) 18px 20px),
      repeating-linear-gradient(25deg,transparent 0 26px,rgba(122,51,36,0.04) 26px 28px);
  }
  .stage{
    position:relative; z-index:2; width:100%; min-height:560px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:56px 34px;
  }

  /* closed */
  .closed{
    display:flex; flex-direction:column; align-items:center; gap:26px;
    transition:opacity 0.5s ease, transform 0.5s ease;
  }
  .mark{
    position:relative; width:46px; height:46px; border:1px solid var(--gold); border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Cormorant Garamond',serif; font-style:italic; font-size:18px; color:var(--gold);
  }
  .mark::before,.mark::after{
    content:''; position:absolute; width:5px; height:5px; background:var(--gold);
    border-radius:50%; animation:twinkle 2.4s ease-in-out infinite;
  }
  .mark::before{ top:-14px; left:-22px; animation-delay:0.3s; }
  .mark::after{ bottom:-10px; right:-26px; animation-delay:1.1s; }
  .closed h1{
    font-family:'Cormorant Garamond',serif; font-weight:500; font-size:2.6rem;
    line-height:1.15; color:var(--cream); margin:0;
  }
  .closed h1 em{ font-style:italic; color:var(--gold); }
  .closed p{
    font-size:0.82rem; letter-spacing:0.06em; color:var(--cream-dim);
    margin:0; max-width:220px; line-height:1.6;
  }
  .reveal-btn{
    margin-top:10px; background:transparent; border:1px solid var(--gold); color:var(--gold);
    font-family:'Jost',sans-serif; font-size:0.85rem; letter-spacing:0.08em;
    padding:14px 34px; border-radius:999px; cursor:pointer;
    transition:background 0.35s ease,color 0.35s ease,transform 0.2s ease;
  }
  .reveal-btn:hover{ background:var(--gold); color:var(--char); }
  .reveal-btn:active{ transform:scale(0.97); }
  .reveal-btn:focus-visible{ outline:2px solid var(--cream); outline-offset:3px; }

  /* open */
  .details{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:48px 34px;
    opacity:0; transform:translateY(14px); pointer-events:none;
    transition:opacity 0.6s ease, transform 0.6s ease;
  }
  .card.open .closed{ opacity:0; transform:translateY(-14px); pointer-events:none; position:absolute; }
  .card.open .details{ opacity:1; transform:translateY(0); pointer-events:auto; }

  .details .eyebrow{
    font-family:'Cormorant Garamond',serif; font-style:italic; color:var(--gold);
    font-size:1rem; margin:0 0 10px;
  }
  .details .wish-en{
    font-family:'Cormorant Garamond',serif; font-weight:500; font-size:2.5rem;
    color:var(--cream); margin:0; line-height:1.15;
  }
  .details .wish-zh{
    font-family:'Cormorant Garamond','Noto Serif SC','Songti SC',serif; font-weight:500;
    font-size:2.2rem; color:var(--gold); margin:10px 0 0; letter-spacing:0.18em;
  }
  .rule{ width:40px; height:1px; background:var(--gold-dim); margin:26px 0; }
  .name{
    font-family:'Cormorant Garamond',serif; font-style:italic; font-weight:500;
    font-size:3rem; color:var(--cream); margin:0; line-height:1.1;
  }
  .sub{
    margin-top:22px; font-size:0.72rem; letter-spacing:0.14em; color:var(--cream-dim);
    text-transform:uppercase;
  }

  .details .eyebrow,.details .wish-en,.details .wish-zh,.details .rule,.details .name,.details .sub{
    opacity:0; transform:translateY(10px);
    transition:opacity 0.55s ease, transform 0.55s ease;
  }
  .card.open .details .eyebrow{ transition-delay:0.05s; }
  .card.open .details .wish-en{ transition-delay:0.15s; }
  .card.open .details .wish-zh{ transition-delay:0.28s; }
  .card.open .details .rule{ transition-delay:0.40s; }
  .card.open .details .name{ transition-delay:0.50s; }
  .card.open .details .sub{ transition-delay:0.68s; }
  .card.open .details .eyebrow,.card.open .details .wish-en,.card.open .details .wish-zh,
  .card.open .details .rule,.card.open .details .name,.card.open .details .sub{
    opacity:1; transform:translateY(0);
  }

  /* stars */
  .stars{ position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .star{
    position:absolute; width:3px; height:3px; background:var(--gold); border-radius:50%;
    opacity:0; animation:twinkle 3.2s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{ opacity:0; transform:scale(0.6); }
    50%{ opacity:0.9; transform:scale(1.4); }
  }

  /* burst */
  .burst{ position:absolute; inset:0; pointer-events:none; z-index:5; }
  .fleck{
    position:absolute; top:50%; left:50%; width:5px; height:5px;
    background:var(--gold); border-radius:50%; opacity:0;
  }
  .fleck.go{ animation:fleck-out 0.9s cubic-bezier(0.16,1,0.3,1) forwards; }
  @keyframes fleck-out{
    0%{ opacity:1; transform:translate(-50%,-50%) scale(1); }
    100%{ opacity:0; transform:translate(var(--tx),var(--ty)) scale(0.3); }
  }

  @media (prefers-reduced-motion: reduce){
    .closed,.details,.card,.fleck,.star,.mark::before,.mark::after{ transition:none; animation:none; }
    .card.open .details *{ opacity:1; transform:none; }
  }
</style>
</head>
<body>

<div class="card" id="card">
  <div class="stage">

    <div class="stars">
      <div class="star" style="top:18%; left:22%; animation-delay:0.2s;"></div>
      <div class="star" style="top:28%; left:78%; animation-delay:1.4s;"></div>
      <div class="star" style="top:62%; left:14%; animation-delay:0.8s;"></div>
      <div class="star" style="top:70%; left:85%; animation-delay:2s;"></div>
      <div class="star" style="top:12%; left:55%; animation-delay:1.7s;"></div>
      <div class="star" style="top:85%; left:50%; animation-delay:0.5s;"></div>
    </div>

    <div class="closed" id="closed">
      <div class="mark">J</div>
      <h1>A Little Wish<br>for <em>Jessica</em></h1>
      <p>Tap below to open your birthday wish.</p>
      <button class="reveal-btn" id="revealBtn">Open Wish</button>
    </div>

    <div class="details" id="details">
      <p class="eyebrow">Wishing you joy today</p>
      <h2 class="wish-en">Happy Birthday</h2>
      <p class="wish-zh">生日快乐</p>
      <div class="rule"></div>
      <p class="name">Jessica</p>
      <p class="sub">★ &nbsp;Shine bright&nbsp; ★</p>
    </div>

  </div>
  <div class="burst" id="burst"></div>
</div>

<script>
  document.getElementById('revealBtn').addEventListener('click', function(){
    var card = document.getElementById('card');
    card.classList.add('open');
    var burst = document.getElementById('burst');
    var count = 24;
    for (var i = 0; i < count; i++){
      var fleck = document.createElement('div');
      fleck.className = 'fleck';
      var angle = (Math.PI * 2 * i) / count + Math.random() * 0.3;
      var dist = 70 + Math.random() * 110;
      fleck.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
      fleck.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
      fleck.style.animationDelay = (Math.random() * 0.15) + 's';
      burst.appendChild(fleck);
      requestAnimationFrame((function(el){ return function(){ el.classList.add('go'); }; })(fleck));
    }
    setTimeout(function(){ burst.innerHTML = ''; }, 1400);
  });
</script>

</body>
</html>
